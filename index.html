<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Striker: Aizen Cross</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Menu / Character Select -->
        <div id="menu-screen" class="screen">
            <h1>THE STRIKER: AIZEN CROSS</h1>
            <p>Pilih Role Karakter Sosuke Aizen</p>
            <div class="role-select">
                <div class="role-card selected" onclick="selectRole('ST')">
                    <h3>Striker (ST)</h3>
                    <p>Power Tendangan Maksimal</p>
                </div>
                <div class="role-card" onclick="selectRole('MID')">
                    <h3>Gelandang (MID)</h3>
                    <p>Kontrol & Passing Cepat</p>
                </div>
                <div class="role-card" onclick="selectRole('GK')">
                    <h3>Goalkeeper (GK)</h3>
                    <p>Refleks Blok Gawang</p>
                </div>
            </div>
            <button id="start-btn" onclick="startGame()">MULAI PERTANDINGAN</button>
        </div>

        <!-- Game Play Screen -->
        <div id="play-screen" class="screen hidden">
            <!-- HUD Atas ala The Spike -->
            <div id="spike-hud">
                <div class="player-hud-card left-card">
                    <div class="avatar" id="p1-avatar">ST</div>
                    <div class="hud-info">
                        <span class="p-name" id="p1-name-text">AIZEN (ST)</span>
                        <div class="bar-container"><div class="fill-bar" id="p1-stamina"></div></div>
                    </div>
                </div>

                <div class="center-score">
                    <span class="score-num" id="score-home">0</span>
                    <span class="score-num" id="score-away">0</span>
                    <div id="match-timer">03:00</div>
                </div>

                <div class="player-hud-card right-card">
                    <div class="hud-info text-right">
                        <span class="p-name">KEN (GK)</span>
                        <div class="bar-container"><div class="fill-bar opponent-bar" id="p2-stamina"></div></div>
                    </div>
                    <div class="avatar opponent-avatar">GK</div>
                </div>
            </div>

            <!-- Canvas Lapangan -->
            <canvas id="gameCanvas" width="800" height="340"></canvas>

            <!-- Virtual Controller (On-Screen Touch Buttons) -->
            <div id="virtual-controller">
                <div class="dpad-group">
                    <button class="ctrl-btn" ontouchstart="setControl('left', true)" ontouchend="setControl('left', false)" onmousedown="setControl('left', true)" onmouseup="setControl('left', false)">◀ Kiri</button>
                    <button class="ctrl-btn" ontouchstart="setControl('right', true)" ontouchend="setControl('right', false)" onmousedown="setControl('right', true)" onmouseup="setControl('right', false)">Kanan ▶</button>
                </div>
                <div class="action-group">
                    <button class="ctrl-btn action-jump" ontouchstart="setControl('jump', true)" ontouchend="setControl('jump', false)" onmousedown="setControl('jump', true)" onmouseup="setControl('jump', false)">Lompat</button>
                    <button class="ctrl-btn action-pass" ontouchstart="setControl('pass', true)" ontouchend="setControl('pass', false)" onmousedown="setControl('pass', true)" onmouseup="setControl('pass', false)">Passing</button>
                    <button class="ctrl-btn action-shoot" ontouchstart="setControl('shoot', true)" ontouchend="setControl('shoot', false)" onmousedown="setControl('shoot', true)" onmouseup="setControl('shoot', false)">Tendang</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
