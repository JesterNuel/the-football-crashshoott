<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Striker: Aizen Bankai Cross</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Menu -->
        <div id="menu-screen" class="screen">
            <h1>THE STRIKER: AIZEN CROSS</h1>
            <p>Mode 3v3 + Ultimate Skill: Bankai Kyoka Suigetsu</p>
            <div class="team-info-box">
                <h3>Karakter: Sosuke Aizen (ST)</h3>
                <p>Tekan tombol BANKAI untuk jurus pemungkas pencetak gol instan!</p>
            </div>
            <button id="start-btn" onclick="startGame()">MULAI PERTANDINGAN</button>
        </div>

        <!-- Game Play Screen -->
        <div id="play-screen" class="screen hidden">
            <!-- Top HUD -->
            <div id="top-hud">
                <div id="left-hud-extras">
                    <div class="icon-btn" title="Determination">🔥</div>
                    <div class="icon-btn" title="Highlights">📷</div>
                </div>
                
                <div id="scoreboard-banner">
                    <span id="team-home-name">Terra FC (Aizen)</span>
                    <div id="score-box">
                        <span id="score-home">0</span>
                        <span id="vs-badge">VS</span>
                        <span id="score-away">0</span>
                    </div>
                    <span id="team-away-name">Blue Lancia</span>
                </div>

                <div id="right-hud-extras">
                    <div class="top-utility-btn">Sub</div>
                    <div class="top-utility-btn">Time</div>
                    <div class="top-utility-btn">⏸</div>
                </div>
            </div>

            <!-- Canvas Lapangan -->
            <canvas id="gameCanvas" width="900" height="420"></canvas>

            <!-- Bottom Controller + Tombol Bankai -->
            <div id="bottom-hud">
                <div id="dpad-container">
                    <div id="dpad-ring">
                        <div class="dpad-arrow" ontouchstart="setControl('left', true)" ontouchend="setControl('left', false)" onmousedown="setControl('left', true)" onmouseup="setControl('left', false)">◀</div>
                        <div class="dpad-arrow" ontouchstart="setControl('right', true)" ontouchend="setControl('right', false)" onmousedown="setControl('right', true)" onmouseup="setControl('right', false)">▶</div>
                    </div>
                </div>

                <!-- Tombol Skill Spesial Bankai -->
                <div id="skill-container">
                    <button id="bankai-btn" onclick="activateBankai()">⚡ BANKAI</button>
                </div>

                <div id="action-buttons-container">
                    <div class="action-circle-btn" ontouchstart="setControl('pass', true)" ontouchend="setControl('pass', false)" onmousedown="setControl('pass', true)" onmouseup="setControl('pass', false)"><span>PASS</span></div>
                    <div class="action-circle-btn action-jump-btn" ontouchstart="setControl('jump', true)" ontouchend="setControl('jump', false)" onmousedown="setControl('jump', true)" onmouseup="setControl('jump', false)"><span>JUMP</span></div>
                    <div class="action-circle-btn action-shoot-btn" ontouchstart="setControl('shoot', true)" ontouchend="setControl('shoot', false)" onmousedown="setControl('shoot', true)" onmouseup="setControl('shoot', false)"><span>SHOOT</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
